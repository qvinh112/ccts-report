<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCVN Weekly — Executive</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
/* Cùng hệ màu với trang nội bộ để hai bản nhìn cùng một nhà */
:root{
  --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#008300; --s5:#4a3aa7;
  --s6:#e34948; --s7:#e87ba4; --s8:#eb6834;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--grid);
  padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 10px 0 0}
header .sub{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--axis);background:var(--surface);border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600;color:var(--ink2)}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
h2{font-size:15px;margin:26px 0 10px;border-left:4px solid var(--ink);padding-left:8px}
h3{font-size:13px;margin:14px 0 6px;color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:12px;margin-bottom:12px}
.note{color:var(--muted);font-size:12px}
a.def{color:var(--s1);text-decoration:none;font-size:11px;margin-left:4px}
/* ---- Tầng 1: 6 ô KPI ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.tile .lbl{font-size:12px;color:var(--ink2);font-weight:600}
.tile .val{font-size:26px;font-weight:700;line-height:1.1}
.tile .val small{font-size:13px;color:var(--muted);font-weight:500}
.tile .dl{font-size:12px}
.up{color:var(--crit)} .down{color:var(--good)} .upgood{color:var(--good)} .downbad{color:var(--crit)}
.tgt{font-size:11px;color:var(--muted)}
.tgt .chip{display:inline-block;border-radius:6px;padding:0 6px;font-weight:600}
.chip.ok{background:#e4f5e4;color:var(--good)} .chip.no{background:#fdeaea;color:var(--crit)}
.chip.na{background:#f0efe9;color:var(--muted)}
.defline{font-size:10.5px;color:var(--muted);border-top:1px dashed var(--grid);padding-top:4px;margin-top:auto}
.ccbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:2px 0}
.ccbar i{display:block;height:100%}
/* badge + cảnh báo */
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.badge{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--axis);border-radius:8px;
  padding:5px 10px;font-size:12px;background:var(--surface);cursor:pointer}
.badge b{font-size:13px}
.alertbar{border-left:4px solid var(--warn);background:#fff8e6;border-radius:8px;padding:8px 12px;font-size:12.5px;flex:1;min-width:260px}
.alertbar.red{border-left-color:var(--crit);background:#fdeeee}
/* bảng */
.twrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--grid);padding:5px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:600;background:var(--surface);position:sticky;top:0}
tr.ref td{background:#f2f6fb;font-weight:600}
tr.miss td{background:#fdf3f3}
td.l{text-align:left;white-space:normal}
.chipst{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11px;font-weight:600}
.st-analyzing{background:#f0efe9;color:var(--ink2)} .st-tqa{background:#eef;color:var(--s5)}
.st-pilot{background:#fff3da;color:#9c6d00} .st-rollout{background:#e2f0ff;color:var(--s1)}
.st-closed{background:#e4f5e4;color:var(--good)} .st-missing{background:#fdeaea;color:var(--crit)}
.exp{cursor:pointer;color:var(--s1);font-weight:600}
.chartbox{position:relative;height:260px}
.chartbox.tall{height:320px}
canvas{max-width:100%}
dialog{border:1px solid var(--grid);border-radius:12px;max-width:640px;width:92vw;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.tile .val{font-size:22px}}
footer{color:var(--muted);font-size:11.5px;text-align:center;padding:20px}
/* ---- In / PDF ---- */
@media print{
  header .seg, header .btn, .noprint{display:none !important}
  header{position:static}
  body{background:#fff}
  .card,.tile{break-inside:avoid;border-color:#ccc}
  main{max-width:none;padding:0 4mm}
  .chartbox{height:230px}
  a.def{display:none}
}
</style>
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <span class="sub" id="hdWeek"></span>
  <span style="flex:1"></span>
  <span class="seg" id="langSeg">
    <button data-lang="vi">VI</button><button data-lang="en">EN</button>
  </span>
  <button class="btn noprint" onclick="window.print()" data-i18n="print"></button>
  <a class="btn noprint" href="definitions.html" data-i18n="defs" style="text-decoration:none"></a>
</header>
<main>

<!-- ===================== TẦNG 1 ===================== -->
<div id="partialNote" class="note" style="margin-bottom:8px"></div>
<div class="tiles" id="tiles"></div>
<div class="strip">
  <span class="badge" id="covBadge" onclick="document.getElementById('covDlg').showModal()"></span>
  <div id="campAlert" style="display:none" class="alertbar"></div>
</div>

<dialog id="covDlg">
  <h3 style="margin-top:0" data-i18n="covTitle"></h3>
  <div id="covBody"></div>
  <p class="note" data-i18n="covNote"></p>
  <button class="btn" onclick="document.getElementById('covDlg').close()" data-i18n="close"></button>
</dialog>

<!-- ===================== TẦNG 2 ===================== -->
<h2><span data-i18n="t2"></span><a class="def" href="definitions.html#cause">ⓘ</a></h2>
<div class="card">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="seg" id="segSeg">
      <button data-seg="EVCS">EVCS</button><button data-seg="BSS">BSS</button>
    </span>
    <span class="note" id="paretoTop"></span>
  </div>
  <div class="grid2" style="margin-top:10px">
    <div><h3 data-i18n="pareto"></h3><div class="chartbox tall"><canvas id="c_pareto"></canvas></div>
      <p class="note" data-i18n="unvNote"></p></div>
    <div><h3 data-i18n="resp"></h3><div class="chartbox tall"><canvas id="c_resp"></canvas></div>
      <p class="note" data-i18n="respNote"></p></div>
  </div>
</div>

<div class="card">
  <h3><span data-i18n="drill"></span> <select id="drillSel" style="max-width:280px"></select></h3>
  <div class="grid2">
    <div><h3>ASP</h3><div class="twrap"><table id="t_drill_asp"></table></div></div>
    <div><h3 data-i18n="prov"></h3><div class="twrap" style="max-height:280px;overflow-y:auto"><table id="t_drill_prov"></table></div></div>
  </div>
</div>

<div class="card">
  <h3><span data-i18n="rank"></span><a class="def" href="definitions.html#rank">ⓘ</a>
    <span class="seg noprint" style="margin-left:10px;font-size:12px" id="sortSeg">
      <button data-sort="ovd" data-i18n="sortAbs"></button><button data-sort="rate" data-i18n="sortRate"></button>
    </span></h3>
  <p class="note" data-i18n="rankNote"></p>
  <div class="grid2">
    <div><h3>ASP</h3><div class="twrap"><table id="t_rank_asp"></table></div></div>
    <div><h3 data-i18n="prov"></h3><div class="twrap" style="max-height:340px;overflow-y:auto"><table id="t_rank_prov"></table></div></div>
  </div>
</div>

<div class="card">
  <h3><span data-i18n="aspTrend"></span> <select id="aspSel"></select></h3>
  <div class="chartbox"><canvas id="c_asp_trend"></canvas></div>
  <p class="note" data-i18n="campNote2"></p>
</div>

<!-- ===================== TẦNG 3 ===================== -->
<h2><span data-i18n="t3"></span><a class="def" href="definitions.html#action">ⓘ</a></h2>
<div id="actAlerts"></div>
<div class="card">
  <p class="note" id="actEmpty" style="display:none"></p>
  <div class="twrap"><table id="t_actions"></table></div>
  <p class="note" data-i18n="actNote"></p>
</div>

</main>
<footer id="foot"></footer>

<script src="exec_data.js"></script>
<script>

/* ================= i18n ================= */
let LANG = localStorage.getItem('execLang') || 'vi';
const I18N = {
 vi: {

};
const T = k => I18N[LANG][k] ?? I18N.vi[k] ?? k;
const TD = s => LANG === 'en' ? (DT_EN[s] ?? s) : s;
const TT = (k, vars) => Object.entries(vars).reduce((s,[a,b]) => s.replaceAll('{'+a+'}', b), T(k));

/* ================= format ================= */
const LOC = () => LANG === 'vi' ? 'vi-VN' : 'en-US';
const fm = n => (n ?? 0).toLocaleString(LOC());
const pc = (v, d=1) => v == null ? '—' : (v*100).toLocaleString(LOC(), {minimumFractionDigits:d, maximumFractionDigits:d}) + '%';
const pp = v => (v > 0 ? '+' : '') + (v*100).toLocaleString(LOC(), {maximumFractionDigits:1}) + (LANG==='vi'?' đ%':' pp');
const hrs = v => v == null ? '—' : v.toLocaleString(LOC(), {maximumFractionDigits:1}) + 'h';

/* ================= Chart.js chung ================= */
const charts = {};
function mk(id, cfg){ if(charts[id]) charts[id].destroy(); charts[id] = new Chart($(id), cfg); }
Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",sans-serif';
Chart.defaults.color = '#52514e';
// vạch dọc (ngày deploy) tại chỉ số tuần cho trước
const vlinePlugin = {
 id:'vline',
 afterDraw(chart, _a, opts){
  if(opts?.idx == null) return;
  const x = chart.scales.x.getPixelForValue(opts.idx);
  const {top, bottom} = chart.chartArea, c = chart.ctx;
  c.save(); c.strokeStyle = '#d03b3b'; c.setLineDash([5,4]); c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x, top); c.lineTo(x, bottom); c.stroke();
  c.setLineDash([]); c.fillStyle = '#d03b3b'; c.font = '11px system-ui';
  c.textAlign = 'center'; c.fillText(opts.label || '', x, top - 4); c.restore();
 }
};
Chart.register(vlinePlugin);

/* ================= Tầng 1 ================= */
const wPrevIdx = D.weeks.length - 2;
const partial = D.coverageWeek?.partial, pdays = D.coverageWeek?.days || 7;
// direction mặc định: mọi KPI hiện có đều lower_is_better
const KPIS = [
 {id:'evcs_fail_rate', lbl:'kpi_evcs', def:'def_evcs', anchor:'evcs',
  cur:()=>D.kpis.evcsFail.cur, prev:()=>D.kpis.evcsFail.series[wPrevIdx], rate:true,
  val:()=>pc(D.kpis.evcsFail.cur, 2)},
 {id:'bss_fail_rate', lbl:'kpi_bss', def:'def_bss', anchor:'bss',
  cur:()=>D.kpis.bssFail.cur, prev:()=>D.kpis.bssFail.series[wPrevIdx], rate:true,
  val:()=>pc(D.kpis.bssFail.cur, 2)},
 {id:'overdue_rate', lbl:'kpi_ovd', def:'def_ovd', anchor:'ovd',
  cur:()=>D.kpis.ovd.cur.rate, prev:()=>D.kpis.ovd.series[wPrevIdx]?.rate, rate:true,
  val:()=>pc(D.kpis.ovd.cur.rate) , sub:()=>`${fm(D.kpis.ovd.cur.ovd)}/${fm(D.kpis.ovd.cur.total)}`},
 {id:'cc_share', lbl:'kpi_cc', def:'def_cc', anchor:'cc',
  cur:()=>D.kpis.cc.cur.share, prev:()=>D.kpis.cc.series[wPrevIdx]?.share, rate:true,
  val:()=>pc(D.kpis.cc.cur.share), bands:true},
 {id:'backlog_rate', lbl:'kpi_backlog', def:'def_backlog', anchor:'backlog',
  cur:()=>D.kpis.backlog.cur.share, prev:()=>D.kpis.backlog.series[wPrevIdx]?.share, rate:true,
  val:()=>fm(D.kpis.backlog.cur.qty), sub:()=>pc(D.kpis.backlog.cur.share)},
 {id:'total_tickets', lbl:'kpi_total', def:'def_total', anchor:'total',
  cur:()=>D.kpis.total.cur, prev:()=>D.kpis.total.series[wPrevIdx], rate:false,
  val:()=>fm(D.kpis.total.cur)},
];

function deltaHtml(k){
  let cur = k.cur(), prev = k.prev();
  if(cur == null || prev == null) return '<span class="tgt">—</span>';
  let note = '';
  if(!k.rate){ cur /= (partial ? pdays : 7); prev /= 7; note = partial ? ' · ' + T('perDay') : ''; }
  const d = cur - prev;
  const tinfo = (D.targets || {})[k.id] || {};
  const lower = (tinfo.direction || 'lower_is_better') === 'lower_is_better';
  const bad = lower ? d > 0 : d < 0;
  const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '＝';
  const cls = d === 0 ? '' : bad ? 'up' : 'down';
  const txt = k.rate ? pp(d) : (d > 0 ? '+' : '') + d.toLocaleString(LOC(), {maximumFractionDigits:1}) + '/d';
  return `<span class="${cls}">${arrow} ${txt}</span> <span class="tgt">${T('vsPrev')}${note}</span>`;
}

function targetHtml(k){
  const t = (D.targets || {})[k.id];
  if(!t || t.target == null)
    return `<span class="chip na">${T('noTarget')}</span>`;
  const lower = (t.direction || 'lower_is_better') === 'lower_is_better';
  const met = lower ? k.cur() <= t.target : k.cur() >= t.target;
  const tv = k.rate ? pc(t.target) : fm(t.target);
  return `<span class="chip ${met?'ok':'no'}">${met?T('met'):T('notMet')}</span> ` +
         `${T('target')} ${tv}${t.set_on ? ` (${T('since')} ${t.set_on})` : ''}`;
}

function renderTiles(){
  $('tiles').innerHTML = KPIS.map(k => {
    const c = D.kpis.cc.cur;
    const bands = k.bands ? `
      <div class="ccbar" title="${TT('ccBands',{cc:fm(c.cc),dis:fm(c.dis),und:fm(c.und)})}">
        <i style="width:${c.cc/(c.cc+c.dis+c.und)*100}%;background:var(--s1)"></i>
        <i style="width:${c.dis/(c.cc+c.dis+c.und)*100}%;background:var(--s2)"></i>
        <i style="width:${c.und/(c.cc+c.dis+c.und)*100}%;background:var(--axis)"></i></div>
      <div class="tgt">${TT('ccBands',{cc:fm(c.cc),dis:fm(c.dis),und:fm(c.und)})}</div>` : '';
    return `<div class="tile">
      <span class="lbl">${T(k.lbl)}<a class="def" href="definitions.html#${k.anchor}">ⓘ</a></span>
      <span class="val">${k.val()}${k.sub ? ` <small>${k.sub()}</small>` : ''}</span>
      <span class="dl">${deltaHtml(k)}</span>${bands}
      <span class="tgt">${targetHtml(k)}</span>
      <span class="defline">${T(k.def)}</span>
    </div>`;
  }).join('');
}

function renderCoverage(){
  const cov = D.coverage;
  $('covBadge').innerHTML = `📊 ${T('covBadge')}: <b>${pc(cov.covPct)}</b>`;
  const L = T('covRow');
  $('covBody').innerHTML = ['EVCS','BSS'].map(seg => {
    const s = cov.segs[seg];
    const out13 = s.outside13.rows.map(r => `${TD(r.name)}: ${fm(r.qty)}`).join(' · ') || '0';
    return `<h3>${seg}</h3><table>
      <tr><td class="l">${L[0]}</td><td>${fm(s.total)}</td></tr>
      <tr><td class="l">${L[1]}</td><td>${fm(s.inProgress)}</td></tr>
      <tr><td class="l">${L[2]}</td><td>${fm(s.outside13.qty)} (${pc(s.outside13.qty/s.total)})<br><span class="note">${out13}</span></td></tr>
      <tr><td class="l">${L[3]}</td><td>${fm(s.noCode)}</td></tr>
      <tr><td class="l">${L[4]}</td><td>${fm(s.mergedCodes)} (${fm(s.mergedVariants)} ${LANG==='vi'?'biến thể':'variants'})</td></tr>
      <tr><td class="l">${L[5]}</td><td>${fm(s.resolved)}</td></tr>
      <tr><td class="l">${L[6]}</td><td><b>${pc(s.covPct)}</b></td></tr></table>`;
  }).join('');
}

function renderCampAlert(){
  const el = $('campAlert');
  const hits = (D.campaigns.rules || []).map(r => {
    const n = Math.max(r.matched[r.matched.length-1] || 0, r.matched[r.matched.length-2] || 0);
    const wi = r.matched[r.matched.length-1] >= n ? D.weeks.length-1 : D.weeks.length-2;
    return {r, n, w: D.weeks[wi]};
  }).filter(h => h.n > 0);
  if(!hits.length){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = hits.map(h => TT('campAlert', {
    n: fm(h.n), seg: h.r.seg, w: h.w,
    label: LANG === 'en' ? h.r.label_en : h.r.label_vi})).join('<br>');
}

/* ================= Tầng 2 ================= */
let SEG = 'BSS', SORT = 'ovd';
const MIN_QTY = 20;

function renderPareto(){
  const rows = D.causes[SEG].rows;
  const tot = rows.reduce((s,r) => s + r.qty, 0);
  let cum = 0;
  const cumv = rows.map(r => (cum += r.qty) / tot);
  const k80 = (cumv.findIndex(v => v >= .8) + 1) || rows.length;
  $('paretoTop').textContent = TT('paretoTop', {k: k80, p: pc(cumv[k80-1] ?? 1, 0), seg: SEG});
  const top = rows.slice(0, 10);
  mk('c_pareto', {
    data:{labels: top.map(r => TD(r.name)), datasets:[
      {type:'bar', data: top.map(r => r.qty), backgroundColor:'#2a78d6', yAxisID:'y'},
      {type:'line', data: cumv.slice(0, 10), borderColor:'#e34948', pointRadius:2, yAxisID:'y2'},
    ]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false},
      tooltip:{callbacks:{label: c => c.dataset.type === 'line' ? ' ' + pc(c.parsed.y) : ' ' + fm(c.parsed.y)}}},
      scales:{x:{ticks:{autoSkip:false, maxRotation:60, font:{size:10}}},
        y:{beginAtZero:true},
        y2:{position:'right', min:0, max:1, ticks:{callback: v => (v*100)+'%'}, grid:{display:false}}}}
  });
  mk('c_resp', {
    type:'bar',
    data:{labels: top.map(r => TD(r.name)), datasets:[
      {label:'ChargeCore', data: top.map(r => r.cc), backgroundColor:'#2a78d6'},
      {label: LANG==='vi'?'Không do CC':'Not CC', data: top.map(r => r.dis), backgroundColor:'#1baf7a'},
      {label: LANG==='vi'?'Chưa phân định':'Unclassified', data: top.map(r => r.und), backgroundColor:'#c3c2b7'},
    ]},
    options:{maintainAspectRatio:false, indexAxis:'y',
      plugins:{legend:{position:'bottom', labels:{boxWidth:12, font:{size:11}}}},
      scales:{x:{stacked:true, beginAtZero:true}, y:{stacked:true, ticks:{font:{size:10}}}}}
  });
}

function renderDrillSel(){
  const rows = D.causes[SEG].rows;
  $('drillSel').innerHTML = rows.map((r,i) => `<option value="${i}">${TD(r.name)} (${fm(r.qty)})</option>`).join('');
  renderDrill();
}
function renderDrill(){
  const r = D.causes[SEG].rows[+$('drillSel').value || 0];
  if(!r) return;
  const H = T('thDrill');
  const head = `<tr>${H.map(h => `<th>${h}</th>`).join('')}</tr>`;
  const row = a => `<tr><td>${a[0]}</td><td>${fm(a[1])}</td><td>${fm(a[2])}</td><td>${fm(a[3])}</td><td>${fm(a[4])}</td></tr>`;
  $('t_drill_asp').innerHTML = head + r.byAsp.map(row).join('');
  $('t_drill_prov').innerHTML = head + r.byProv.map(a =>
    row([(D.provinces[a[0]]?.[0] ?? a[0]), ...a.slice(1)])).join('');
}

function rankRow(r, ref){
  return `<tr${ref ? ' class="ref"' : ''}><td>${ref ? T('national') : TD(r.k)}</td><td>${fm(r.qty)}</td><td>${fm(r.ovd)}</td>` +
    `<td>${pc(r.rate)}</td><td>${hrs(r.med)}</td><td>${pc(r.ontime)}</td><td>${hrs(r.voms)}</td></tr>`;
}
function renderRank(){
  const head = `<tr>${T('thRank').map(h => `<th>${h}</th>`).join('')}</tr>`;
  const nat = D.perf.all[0];
  const srt = (a,b) => SORT === 'ovd' ? b.ovd - a.ovd : b.rate - a.rate;
  const asp = [...D.perf.asp].filter(r => r.qty >= MIN_QTY).sort(srt);
  const prov = [...D.perf.prov].filter(r => r.qty >= MIN_QTY).sort(srt);
  $('t_rank_asp').innerHTML = head + asp.map(r => rankRow(r)).join('') + (nat ? rankRow(nat, true) : '');
  $('t_rank_prov').innerHTML = head + prov.map(r => rankRow(r)).join('') + (nat ? rankRow(nat, true) : '');
}

function renderAspTrend(){
  const asp = $('aspSel').value || 'EC';
  const s = D.campaigns.byAsp[asp];
  if(!s) return;
  mk('c_asp_trend', {
    type:'bar',
    data:{labels: D.weeks, datasets:[
      {label: T('natural'), data: s.natural, backgroundColor:'#2a78d6'},
      {label: T('campaign'), data: s.campaign, backgroundColor:'#eda100'},
    ]},
    options:{maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{boxWidth:12}}},
      scales:{x:{stacked:true}, y:{stacked:true, beginAtZero:true}}}
  });
}

/* ================= Tầng 3 ================= */
function chipSt(r){
  if(r.missing_action) return `<span class="chipst st-missing">${T('stMissing')}</span>`;
  const s = r.status || 'analyzing';
  return `<span class="chipst st-${s}">${T('status')[s] ?? s}</span>`;
}
function renderActions(){
  const rows = D.actions.rows;
  $('actEmpty').style.display = D.actions.cfgEmpty ? 'block' : 'none';
  $('actEmpty').textContent = T('actEmpty');
  const head = `<tr>${T('thAct').map(h => `<th>${h}</th>`).join('')}</tr>`;
  $('t_actions').innerHTML = head + rows.map((r, i) => {
    const d = r.prev == null ? '—' :
      `<span class="${r.qty > r.prev ? 'up' : r.qty < r.prev ? 'down' : ''}">${r.qty > r.prev ? '▲' : r.qty < r.prev ? '▼' : '＝'} ${fm(Math.abs(r.qty - r.prev))}</span>`;
    const rc = r.missing_action ? '—' : (LANG === 'en' ? (r.root_cause_en || r.root_cause_vi) : r.root_cause_vi) || '—';
    const sol = r.missing_action ? '—' : (LANG === 'en' ? (r.solution_en || r.solution_vi) : r.solution_vi) || '—';
    const tgt = r.target_value != null ? `${r.target_metric || ''} ≤ ${fm(r.target_value)}` : '—';
    return `<tr${r.missing_action ? ' class="miss"' : ''}>
      <td><b>${r.error_code}</b></td><td>${r.product_line}</td><td>${fm(r.qty)}</td><td>${d}</td>
      <td class="l" style="max-width:180px">${rc}</td><td class="l" style="max-width:180px">${sol}</td>
      <td>${r.missing_action ? '—' : (T('types')[r.solution_type] ?? r.solution_type ?? '—')}</td>
      <td>${chipSt(r)}</td><td>${r.owner || '—'}</td><td>${r.due_date || '—'}</td><td>${tgt}</td>
      <td><span class="exp" onclick="toggleAct(${i}, this)">▸</span></td></tr>
      <tr id="actrow_${i}" style="display:none"><td colspan="12">
        <div class="chartbox" style="height:180px"><canvas id="act_${i}"></canvas></div></td></tr>`;
  }).join('');
  // cảnh báo tự động
  $('actAlerts').innerHTML = (D.actions.alerts || []).map(a =>
    `<div class="alertbar red" style="margin-bottom:8px">${
      a.type === 'due_passed'
        ? TT('alertDue', {code: a.code, seg: a.seg, due: a.due})
        : TT('alertNoImp', {code: a.code, seg: a.seg, dep: a.deployed, base: fm(a.base), cur: fm(a.cur)})
    }</div>`).join('');
}
function toggleAct(i, el){
  const tr = $('actrow_' + i);
  const open = tr.style.display !== 'none';
  tr.style.display = open ? 'none' : '';
  el.textContent = open ? '▸' : '▾';
  if(open) return;
  const r = D.actions.rows[i];
  // vạch deploy: tìm tuần chứa deployed_on theo weekRanges
  let idx = null;
  if(r.deployed_on){
    idx = D.weeks.findIndex(w => {
      const g = D.actions.weekRanges[w];
      return g && g[1] && r.deployed_on <= g[1];
    });
    if(idx < 0) idx = null;
  }
  mk('act_' + i, {
    type:'line',
    data:{labels: D.weeks, datasets:[{label: r.error_code + ' · ' + r.product_line,
      data: r.series, borderColor:'#2a78d6', backgroundColor:'rgba(42,120,214,.12)', fill:true, pointRadius:3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false},
      vline:{idx, label: idx != null ? (T('deployed') + ' ' + r.deployed_on) : ''}},
      scales:{y:{beginAtZero:true}}}
  });
}

/* ================= render tổng ================= */
function renderStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.title = T('title');
  document.documentElement.lang = LANG;
  $('hdWeek').textContent = `${D.week} · ${T('scope')}`;
  $('partialNote').textContent = partial
    ? TT('partial', {w: D.week, d: pdays, f: D.coverageWeek.from, t: D.coverageWeek.to}) : '';
  $('foot').textContent = TT('foot', {t: D.generatedAt, scope: T('scope')});
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  document.querySelectorAll('#segSeg button').forEach(b => b.classList.toggle('on', b.dataset.seg === SEG));
  document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.sort === SORT));
}
function renderAll(){
  renderStatic(); renderTiles(); renderCoverage(); renderCampAlert();
  renderPareto(); renderDrillSel(); renderRank(); renderAspTrend(); renderActions();
}
$('langSeg').onclick = e => { if(e.target.dataset.lang){ LANG = e.target.dataset.lang;
  localStorage.setItem('execLang', LANG); renderAll(); } };
$('segSeg').onclick = e => { if(e.target.dataset.seg){ SEG = e.target.dataset.seg;
  renderStatic(); renderPareto(); renderDrillSel(); } };
$('sortSeg').onclick = e => { if(e.target.dataset.sort){ SORT = e.target.dataset.sort;
  renderStatic(); renderRank(); } };
$('drillSel').onchange = renderDrill;
$('aspSel').innerHTML = Object.keys(EXEC_DATA.campaigns.byAsp).map(a => `<option>${a}</option>`).join('');
$('aspSel').onchange = renderAspTrend;
renderAll();
</script>
